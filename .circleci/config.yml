version: 2.1
jobs:
  run_tests:
    docker:
     - image: circleci/node:12
    steps:
      - checkout
      - run:
          name: Install npm dependencies
          command:
            npm install --save
build_docker_image:
  docker:
    - image: circleci/node:12
  steps: 
    - checkout
    - setup_remote_docker:
        docker_layer_caching: false
    - run:
        name: build Docker image
        command:
          docker build -t nodejswebapp -t jinesh1893/nodejswebapp:latest .
          echo $Docker_PASSWORD | docker login -u jinesh1893 --password-stdin
          docker push jinesh1893/nodejswebapp:latest
        
workflows:
  build_test:
    jobs:
      - build_test
      - build_docker_image
